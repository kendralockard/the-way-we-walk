<!doctype html>
<html lang="en">
  <head>
    <title>Contact — The Way We Walk</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='4' fill='%23FAF7F0'/><path d='M10.00,9.20 L10.29,9.09 L10.65,9.10 L11.02,9.26 L11.35,9.56 L11.57,10.00 L11.64,10.53 L11.52,11.10 L11.19,11.64 L10.68,12.08 L10.00,12.34 L9.23,12.37 L8.44,12.14 L7.73,11.65 L7.19,10.91 L6.89,10.00 L6.90,8.99 L7.23,7.99 L7.90,7.11 L8.85,6.46 L10.00,6.12 L11.25,6.16 L12.46,6.61 L13.51,7.45 L14.28,8.61 L14.65,10.00 L14.57,11.48 L14.01,12.91 L13.00,14.14 L11.63,15.01 L10.00,15.42 L8.28,15.30 L6.63,14.63 L5.24,13.46 L4.26,11.87 L3.81,10.00 L3.97,8.04 L4.74,6.18 L6.09,4.62 L7.90,3.53 L10.00,3.04 L12.20,3.23 L14.27,4.12 L16.00,5.64 L17.21,7.66 L17.73,10.00 L17.50,12.44 L16.50,14.72 L14.82,16.63 L12.58,17.94 L10.00,18.50' stroke='%232A2A24' stroke-width='1.7' stroke-linecap='round' fill='none'/></svg>"
    />
    <script src="https://cdn.userway.org/widget.js" data-account="0WvC8qDpOY" data-position="3"></script>
  </head>
  <body>
    <!-- Navbar is injected by navbar.js (shared across pages). -->
    <div class="site-nav nav-sticky" id="site-nav"></div>
    <script src="js/navbar.js"></script>

    <!-- Banner -->
    <div class="parallax-band parallax-contact">
      <span class="banner-title">contact</span>
    </div>

    <div class="section-contact" id="contact">
      <form
        id="contactForm"
        name="contact"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
        action="/thank-you.html"
      >
        <input type="hidden" name="form-name" value="contact" />
        <p hidden><label>Don't fill this out: <input name="bot-field" /></label></p>
        <div class="form-field">
          <label class="form-label" for="contact-name">name</label>
          <input class="form-input" type="text" required name="name" id="contact-name" />
        </div>
        <div class="form-field">
          <label class="form-label" for="contact-email">email</label>
          <input class="form-input" type="email" required name="email" id="contact-email" />
        </div>
        <div class="form-field">
          <label class="form-label" for="contact-message">message</label>
          <textarea class="form-textarea" required name="message" id="contact-message" rows="4"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-contact-submit">send</button>
        </div>
      </form>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-wordmark">the way we walk</div>
      </div>
    </footer>
  </body>
</html>
