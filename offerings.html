<!doctype html>
<html lang="en">
  <head>
    <title>Offerings — The Way We Walk</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar is injected by navbar.js (shared across pages). -->
    <div class="w3-top" id="site-nav"></div>
    <script src="js/navbar.js"></script>

    <!-- Banner -->
    <div class="bgimg-offerings w3-display-container w3-opacity-min">
      <div class="w3-display-middle">
        <span class="w3-xxlarge w3-text-white w3-wide">offerings</span>
      </div>
    </div>

    <!-- Intro -->
    <div class="w3-content w3-container w3-padding-64" id="offerings">
      <div class="w3-center">
        <h3 class="w3-center">current offerings</h3>
      </div>

      <!-- Trip cards are rendered by the script at the bottom of this page,
           from the `trips` array. To add/edit/remove a trip, edit that one
           list — you don't need to touch the markup here. -->
      <div class="w3-row-padding w3-padding-32" id="trip-cards"></div>

      <template id="trip-card-template">
        <div class="w3-col m4 w3-margin-bottom">
          <div class="w3-card w3-round w3-white">
            <img class="trip-card-image" alt="" />
            <div class="trip-card-placeholder w3-light-grey w3-center">
              <i class="fa fa-picture-o w3-jumbo w3-text-grey"></i>
            </div>
            <div class="w3-container w3-padding-16">
              <h4><span class="trip-name"></span><small class="trip-detail"></small></h4>
              <p class="w3-text-grey">
                <i class="fa fa-calendar w3-margin-right"></i><span class="trip-dates"></span><br />
                <i class="fa fa-map-marker w3-margin-right"></i><span class="trip-location"></span>
              </p>
              <p class="trip-description"></p>
              <a href="" class="w3-button w3-black w3-round w3-medium">see more &rarr;</a>
            </div>
          </div>
        </div>
      </template>
    </div>

    <footer class="w3-center w3-black w3-padding-64">
      <a href="index.html" class="w3-button w3-light-grey"
        ><i class="fa fa-arrow-left w3-margin-right"></i>back home</a
      >
    </footer>

    <script src="js/script.js"></script>
    <script src="js/offerings.js"></script>
  </body>
</html>
