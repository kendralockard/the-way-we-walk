<!doctype html>
<html lang="en">
  <head>
    <title>Offerings — The Way We Walk</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar: links point back to the home page sections (index.html#...) -->
    <div class="w3-top">
      <div class="w3-bar" id="myNavbar">
        <a
          class="w3-bar-item w3-button w3-hover-black w3-hide-medium w3-hide-large w3-right"
          href="javascript:void(0);"
          onclick="toggleFunction()"
          title="Toggle Navigation Menu"
        >
          <i class="fa fa-bars"></i>
        </a>
        <a href="index.html#home" class="w3-bar-item w3-button w3-hide-small"
          >home</a
        >
        <a href="index.html#about" class="w3-bar-item w3-button w3-hide-small"
          ><i class="fa fa-user"></i> about</a
        >
        <a href="offerings.html" class="w3-bar-item w3-button w3-hide-small"
          ><i class="fa fa-map-o"></i> offerings</a
        >
        <a href="index.html#contact" class="w3-bar-item w3-button w3-hide-small"
          ><i class="fa fa-envelope"></i> contact</a
        >
      </div>

      <div
        id="navDemo"
        class="w3-bar-block w3-white w3-hide w3-hide-large w3-hide-medium"
      >
        <a href="index.html#home" class="w3-bar-item w3-button">home</a>
        <a href="index.html#about" class="w3-bar-item w3-button">about</a>
        <a href="offerings.html" class="w3-bar-item w3-button">offerings</a>
        <a href="index.html#contact" class="w3-bar-item w3-button">contact</a>
      </div>
    </div>

    <!-- Banner -->
    <div class="bgimg-5 w3-display-container w3-opacity-min">
      <div class="w3-display-middle">
        <span class="w3-xxlarge w3-text-black w3-wide">offerings</span>
      </div>
    </div>

    <!-- Intro -->
    <div class="w3-content w3-container w3-padding-64" id="offerings">
      <div class="w3-center">
        <h3 class="w3-center">current offerings</h3>
        <p>
          [ Placeholder intro — a sentence or two about the trips below and how
          the sign-up works. ]
        </p>
      </div>

      <!-- Trip cards are rendered by the script at the bottom of this page,
           from the `trips` array. To add/edit/remove a trip, edit that one
           list — you don't need to touch the markup here. -->
      <div class="w3-row-padding w3-padding-32" id="trip-cards"></div>
    </div>

    <!-- Sign-up form (delivered via Netlify, like the contact form) -->
    <div class="w3-content w3-container w3-padding-64" id="signup">
      <div class="w3-center">
        <h3 class="w3-center">sign up</h3>
        <p>
          Interested in joining a trip? Send your details and we'll be in touch.
        </p>
      </div>
      <div class="w3-row">
        <div class="w3-col l8 m10" style="margin: 0 auto; float: none">
          <form
            id="signupForm"
            name="trip-signup"
            method="POST"
            data-netlify="true"
            netlify-honeypot="bot-field"
            action="/thank-you.html"
          >
            <input type="hidden" name="form-name" value="trip-signup" />
            <p hidden>
              <label>Don't fill this out: <input name="bot-field" /></label>
            </p>
            <input
              class="w3-input w3-border"
              type="text"
              placeholder="name"
              required
              name="name"
            />
            <input
              class="w3-input w3-border w3-section"
              type="email"
              placeholder="email"
              required
              name="email"
            />
            <!-- Trip options are filled in by the script below (same `trips`
                 list). Clicking a card's "request a spot" pre-selects it. -->
            <select
              class="w3-select w3-border w3-section"
              name="trip"
              id="trip-select"
              required
            >
              <option value="" disabled selected>which trip?</option>
            </select>
            <textarea
              class="w3-input w3-border w3-section"
              placeholder="anything you'd like us to know"
              name="message"
              rows="4"
            ></textarea>
            <button
              class="w3-button w3-black w3-right w3-section"
              type="submit"
            >
              <i class="fa fa-paper-plane"></i> send
            </button>
          </form>
        </div>
      </div>
    </div>

    <footer class="w3-center w3-black w3-padding-64">
      <a href="index.html" class="w3-button w3-light-grey"
        ><i class="fa fa-arrow-left w3-margin-right"></i>back home</a
      >
    </footer>

    <script src="script.js"></script>
    <script>
      // ---------------------------------------------------------------------
      // EDIT YOUR TRIPS HERE. Add, remove, or change entries in this one list
      // and both the cards above and the sign-up dropdown update automatically.
      // `image` is optional — leave it as "" to show the grey placeholder.
      // ---------------------------------------------------------------------
      var trips = [
        {
          name: "[ Trip 1 name ]",
          dates: "[ dates ]",
          location: "[ location ]",
          description: "[ A short description of the trip. ]",
          image: "", // e.g. "images/trip1.jpg"
        },
        {
          name: "[ Trip 2 name ]",
          dates: "[ dates ]",
          location: "[ location ]",
          description: "[ A short description of the trip. ]",
          image: "",
        },
        {
          name: "[ Trip 3 name ]",
          dates: "[ dates ]",
          location: "[ location ]",
          description: "[ A short description of the trip. ]",
          image: "",
        },
      ];

      (function () {
        var cards = document.getElementById("trip-cards");
        var select = document.getElementById("trip-select");

        // Escape any characters that would break the HTML/attribute strings.
        function esc(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        trips.forEach(function (trip) {
          var media = trip.image
            ? '<img src="' +
              esc(trip.image) +
              '" class="w3-image" style="width:100%" alt="' +
              esc(trip.name) +
              '" />'
            : '<div class="w3-light-grey w3-center" style="display:flex;align-items:center;justify-content:center;min-height:200px;">' +
              '<i class="fa fa-picture-o w3-jumbo w3-text-grey"></i></div>';

          var col = document.createElement("div");
          col.className = "w3-col m4 w3-margin-bottom";
          col.innerHTML =
            '<div class="w3-card w3-round w3-white">' +
            media +
            '<div class="w3-container w3-padding-16">' +
            "<h4>" +
            esc(trip.name) +
            "</h4>" +
            '<p class="w3-text-grey">' +
            '<i class="fa fa-calendar w3-margin-right"></i>' +
            esc(trip.dates) +
            "<br />" +
            '<i class="fa fa-map-marker w3-margin-right"></i>' +
            esc(trip.location) +
            "</p>" +
            "<p>" +
            esc(trip.description) +
            "</p>" +
            '<a href="#signup" class="w3-button w3-black w3-round w3-medium" data-trip="' +
            esc(trip.name) +
            '">request a spot &rarr;</a>' +
            "</div></div>";
          cards.appendChild(col);

          var opt = document.createElement("option");
          opt.textContent = trip.name;
          select.appendChild(opt);
        });

        // A catch-all option after the specific trips.
        var general = document.createElement("option");
        general.textContent = "not sure yet / general interest";
        select.appendChild(general);

        // Clicking a card's "request a spot" pre-selects that trip in the form.
        cards.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-trip]");
          if (btn) select.value = btn.getAttribute("data-trip");
        });
      })();
    </script>
  </body>
</html>
