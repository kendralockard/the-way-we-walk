<!doctype html>
<html lang="en">
  <head>
    <title>Offerings — The Way We Walk</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='4' fill='%23FAF7F0'/><path d='M10.00,9.20 L10.29,9.09 L10.65,9.10 L11.02,9.26 L11.35,9.56 L11.57,10.00 L11.64,10.53 L11.52,11.10 L11.19,11.64 L10.68,12.08 L10.00,12.34 L9.23,12.37 L8.44,12.14 L7.73,11.65 L7.19,10.91 L6.89,10.00 L6.90,8.99 L7.23,7.99 L7.90,7.11 L8.85,6.46 L10.00,6.12 L11.25,6.16 L12.46,6.61 L13.51,7.45 L14.28,8.61 L14.65,10.00 L14.57,11.48 L14.01,12.91 L13.00,14.14 L11.63,15.01 L10.00,15.42 L8.28,15.30 L6.63,14.63 L5.24,13.46 L4.26,11.87 L3.81,10.00 L3.97,8.04 L4.74,6.18 L6.09,4.62 L7.90,3.53 L10.00,3.04 L12.20,3.23 L14.27,4.12 L16.00,5.64 L17.21,7.66 L17.73,10.00 L17.50,12.44 L16.50,14.72 L14.82,16.63 L12.58,17.94 L10.00,18.50' stroke='%232A2A24' stroke-width='1.7' stroke-linecap='round' fill='none'/></svg>"
    />
    <script src="https://cdn.userway.org/widget.js" data-account="0WvC8qDpOY" data-position="3"></script>
  </head>
  <body>
    <!-- Navbar is injected by navbar.js (shared across pages). -->
    <div class="site-nav nav-sticky" id="site-nav"></div>
    <script src="js/navbar.js"></script>

    <!-- Banner -->
    <div class="parallax-band parallax-offerings">
      <span class="banner-title">offerings</span>
    </div>

    <!-- Intro -->
    <div class="section-offerings" id="offerings">
      <div class="offerings-intro">
        <div class="label-gold">current offerings</div>
      </div>

      <!-- Trip cards are rendered by the script at the bottom of this page,
           from the `trips` array. To add/edit/remove a trip, edit that one
           list — you don't need to touch the markup here. Each trip's
           `status` ("current" or "past") decides which section it lands in. -->
      <div class="trip-cards" id="trip-cards-current"></div>

      <div class="offerings-intro offerings-intro-past">
        <div class="label-gold">past offerings</div>
      </div>

      <div class="trip-cards" id="trip-cards-past"></div>

      <template id="trip-card-template">
        <div class="trip-card">
          <img class="trip-card-image" alt="" />
          <div class="trip-card-placeholder">
            <span>trip photo</span>
          </div>
          <div class="trip-card-body">
            <div class="trip-card-name"></div>
            <div class="trip-card-detail"></div>
            <div class="trip-divider"></div>
            <p class="trip-meta trip-dates">
              <svg class="trip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span class="trip-meta-text"></span>
            </p>
            <p class="trip-meta trip-location">
              <svg class="trip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-7.2-7-12a7 7 0 1 1 14 0c0 4.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>
              <span class="trip-meta-text"></span>
            </p>
            <p class="trip-desc"></p>
            <a href="" class="btn btn-see-more">see more &rarr;</a>
          </div>
        </div>
      </template>
    </div>

    <script src="js/offerings.js"></script>
  </body>
</html>
